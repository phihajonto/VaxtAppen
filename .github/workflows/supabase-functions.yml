# Driftsätter påminnelsefunktionen (supabase/functions/send-reminders) i Supabase automatiskt
# varje gång den ändras på main, så att ingen behöver klistra in koden för hand.
#
# Engångsinställning: lägg in en Supabase-åtkomsttoken som hemlighet i GitHub.
#   1. supabase.com → kontomenyn → Access Tokens → Generate new token.
#   2. GitHub-repot → Settings → Secrets and variables → Actions → New repository secret.
#      Namn: SUPABASE_ACCESS_TOKEN, värde: token från steg 1.
# Utan hemligheten hoppar jobbet över driftsättningen och säger det i loggen, i stället för att misslyckas.
name: Driftsätt Supabase-funktioner

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bpgmsbxhevlqdunoxhye
    steps:
      - name: Kontrollera åtkomsttoken
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN saknas, så funktionen driftsattes inte. Se instruktionen överst i .github/workflows/supabase-functions.yml."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest
      - name: Driftsätt send-reminders
        if: steps.token.outputs.ok == 'true'
        run: supabase functions deploy send-reminders --project-ref "$PROJECT_REF"
