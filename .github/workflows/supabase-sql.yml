# Kör databasfiler i Supabase automatiskt när de ändras på main, så att ingen behöver klistra in dem i
# SQL Editor. Använder samma hemlighet som funktionerna: SUPABASE_ACCESS_TOKEN.
#
# Bara filer som går att köra flera gånger utan att något förstörs får köras härifrån:
#   supabase/2-paminnelse-varje-morgon.sql  (schemat för morgonjobbet)
#   supabase/3-hushall.sql                  (hushåll)
# 1-databas.sql körs aldrig automatiskt: den skapar databasen från början och skulle skriva över funktionerna.
name: Kör SQL i Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/2-paminnelse-varje-morgon.sql"
      - "supabase/3-hushall.sql"
  workflow_dispatch:
    inputs:
      file:
        description: "Fil att köra"
        required: true
        type: choice
        options:
          - supabase/2-paminnelse-varje-morgon.sql
          - supabase/3-hushall.sql

concurrency:
  group: supabase-sql
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bpgmsbxhevlqdunoxhye
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Välj filer
        id: files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES="${{ inputs.file }}"
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- supabase/2-paminnelse-varje-morgon.sql supabase/3-hushall.sql | tr '\n' ' ')
          fi
          echo "Filer: $FILES"
          echo "list=$FILES" >> "$GITHUB_OUTPUT"
      - name: Kör filerna
        if: steps.files.outputs.list != ''
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN saknas. Lägg in den under Settings → Secrets and variables → Actions."
            exit 1
          fi
          for f in ${{ steps.files.outputs.list }}; do
            echo "Kör $f"
            jq -n --rawfile q "$f" '{query: $q}' > body.json
            HTTP=$(curl -sS -o resp.json -w '%{http_code}' --max-time 120 \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @body.json)
            echo "HTTP $HTTP"; head -c 2000 resp.json; echo
            if [ "${HTTP:0:1}" != "2" ]; then
              echo "::error::$f misslyckades (HTTP $HTTP). Kör filen för hand i Supabase → SQL Editor."
              exit 1
            fi
          done
      - name: Kontrollera morgonjobbets schema
        if: contains(steps.files.outputs.list, '2-paminnelse')
        run: |
          jq -n '{query: "select jobname, schedule, active from cron.job where jobname = '\''vaxtvakten-paminnelse'\''"}' > body.json
          curl -sS --max-time 60 -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @body.json | tee resp.json; echo
          grep -q '0 5,6 \* \* \*' resp.json || { echo "::error::Morgonjobbet har inte det nya schemat."; exit 1; }
