<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Växtvakten</title>
<meta name="description" content="Håll koll på när varje krukväxt ska vattnas.">
<meta name="theme-color" content="#2f5d3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Växtvakten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="lock" id="lock" hidden>
  <form class="lock-card" id="pinForm">
    <h1>Växtvakten</h1>
    <p>Skriv in PIN-koden för att se och vattna växterna.</p>
    <label for="pinInput" class="sr-only" style="position:absolute;left:-9999px">PIN-kod</label>
    <input id="pinInput" type="password" inputmode="text" autocomplete="current-password" required placeholder="PIN-kod">
    <button class="btn primary" type="submit">Öppna</button>
    <div class="err" id="pinErr" role="alert"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <div class="date" id="today"></div>
      <h1>Växtvakten</h1>
    </div>
    <div class="head-actions">
      <button class="btn" id="remindBtn" type="button">Påminnelser</button>
      <button class="btn primary" id="addBtn" type="button">+ Lägg till växt</button>
    </div>
  </header>

  <section class="status" id="status" aria-live="polite">
    <svg class="drop" viewBox="0 0 46 46" aria-hidden="true"><path d="M23 5c7 9 13 16 13 23a13 13 0 0 1-26 0c0-7 6-14 13-23z" fill="var(--water)" opacity=".9"/><path d="M17 29a6 6 0 0 0 6 6" stroke="var(--surface)" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <div><div class="big" id="statusBig">Hämtar växterna …</div><div class="sub" id="statusSub"></div></div>
  </section>

  <div class="notice" id="storeNotice" hidden></div>

  <section id="dueSection" hidden><div class="section-label">Behöver vatten</div><div class="list" id="dueList"></div></section>
  <section id="okSection" hidden><div class="section-label">Klara för nu</div><div class="list" id="okList"></div></section>
  <div class="empty" id="empty" hidden>
    <h2>Inga växter än</h2>
    <p>Lägg till din första växt med namn, beskrivning och hur ofta den ska vattnas.</p>
    <button class="btn primary" type="button" data-action="add">+ Lägg till växt</button>
  </div>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
